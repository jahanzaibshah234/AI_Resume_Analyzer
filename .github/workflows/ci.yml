name: FastAPI CI/CD Pipeline

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
    # 1. Grab the code from your GitHub repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python (Matching the version you used locally)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Speeds up future runs by caching dependencies

    # 3. Install all the packages from your requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r resume_project/requirements.txt

    # 4. Run the automated test suite
    - name: Run tests with Pytest
      env:
        # We provide a fake key here so model.py can import successfully 
        # without exposing your real Gemini API key to the public runner!
        GEMINI_API_KEY: "dummy_key_for_ci_testing_only"
      run: |
        cd resume_project
        pytest test.py -v
